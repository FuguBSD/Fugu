name: Test

# Use explicit includes, never excludes. Only what `make test` and
# `make spec-coverage` load may start a run. Note that the
# Build workflow releases from a successful run of this one. Thus a
# path that this list omits is also a change that never ships.
on:
  push:
    branches: [main]
    paths:
      # The files that the suite loads
      - "lib/**.pm"
      - "lib/**.pod"
      # Every *.t in the tree, not only the directories that
      # `make test` proves. spec-coverage scans all of t/ for spec
      # citations. Thus a stale citation anywhere must be able to fail
      # this workflow.
      - "t/**.t"
      # The other half of the spec-coverage cross-check
      - "spec/*.md"
      # The suite runs scripts as subprocesses: spec-coverage, deps and
      # dist against fixtures, and conventions.t over the directory as
      # a whole. Thus the workflow must see all of scripts/. A glob is
      # necessary because the files in scripts/ have no extension.
      - "scripts/*"
      # The toolchain and the dependency set that the job installs
      - "Makefile"
      - "cpanfile"
      - "deps/*.txt"
      - ".toolingrc"
      - ".github/workflows/test.yml"
  pull_request:
    branches: [main]
    paths:
      - "lib/**.pm"
      - "lib/**.pod"
      - "t/**.t"
      - "spec/*.md"
      - "scripts/*"
      - "Makefile"
      - "cpanfile"
      - "deps/*.txt"
      - ".toolingrc"
      - ".github/workflows/test.yml"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Perl
        uses: FuguBSD/Tooling/perl/actions/setup-perl@main
        with:
          dependencies: test

      - name: Run tests
        run: make test

      - name: Check spec coverage
        run: make spec-coverage

  # The floor leg. macOS ships perl 5.34 in base, and that perl is the
  # floor of the library. The leg installs nothing, so one run proves
  # the core-only claim and the floor claim together. It must not run
  # `make check`: the lint gate and the format gate need Perl::Critic
  # and Perl::Tidy from CPAN.
  floor:
    name: Perl floor
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      # The glob list holds the Fugu-owned tiers only. The two tests
      # under t/ci/ come from the org pack and keep `use v5.36`, so
      # perl 5.34 stops at that line before a skip can run.
      #
      # PROVE names the base perl, because the image can add a newer
      # perl to PATH at any time. A leg that ran that perl would prove
      # nothing about the floor.
      #
      # The guard stops the leg when the image raises the base perl to
      # 5.36 or above. Without it the leg stays green and proves
      # nothing.
      - name: Run the Fugu-owned tiers on the base perl
        run: |
          /usr/bin/perl -e 'print "$^V\n"'
          /usr/bin/perl -e 'exit($] >= 5.036)' || {
            echo 'The base perl reached 5.36. This leg no longer proves the floor.' >&2
            exit 1
          }
          make test PROVE='/usr/bin/perl /usr/bin/prove -l' \
            TEST_GLOBS="t/fugu/*.t t/protocol/*.t t/conformance/*.t t/scripts/*.t"
