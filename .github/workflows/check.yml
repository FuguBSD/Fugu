name: Check

# Use explicit includes, never excludes. A path that no job reads must
# not start this workflow only because nobody excluded it. The list is
# the union of the paths that the three jobs below read.
on:
  push:
    branches: [main]
    paths:
      # The Perl files that format, lint and the syntax sweep read. The
      # files in scripts/ have no extension. Thus a glob over the
      # directory is the only way to name all of them.
      - "scripts/*"
      - "t/ci/workflows.t"
      - "lib/**.pm"
      - ".perlcriticrc"
      - ".perltidyrc"
      # Prettier formats every Markdown, JSON and YAML file in the
      # tree, so this workflow must see all of them. The YAML glob also
      # makes the workflow run again on edits to itself and to the
      # composite action under .github/.
      - "**.md"
      - "**.json"
      - "**.yml"
      - ".prettierrc"
      # The toolchain that the jobs install and use
      - "GNUmakefile"
      - "mk/*"
      - "cpanfile"
      - "deps/*.txt"
  pull_request:
    branches: [main]
    paths:
      - "scripts/*"
      - "t/ci/workflows.t"
      - "lib/**.pm"
      - ".perlcriticrc"
      - ".perltidyrc"
      - "**.md"
      - "**.json"
      - "**.yml"
      - ".prettierrc"
      - "GNUmakefile"
      - "mk/*"
      - "cpanfile"
      - "deps/*.txt"

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Perl
        uses: FuguBSD/Tooling/perl/actions/setup-perl@main
        with:
          dependencies: test

      - name: Check formatting
        run: make format

  format-md:
    name: Format MD
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check Markdown/JSON/YAML formatting
        run: make format-md

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Perl
        uses: FuguBSD/Tooling/perl/actions/setup-perl@main
        with:
          dependencies: test

      - name: Check lint
        run: make lint

      # find -exec ... \; does not propagate the exit status, so a
      # module that fails to compile prints an error and the step
      # passes. xargs does propagate it.
      - name: Check Perl syntax
        run: |
          find lib -name "*.pm" -print0 | xargs -0 -n1 perl -I lib -cw

  drift:
    name: Drift
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Checkout the shared tooling
        uses: actions/checkout@v4
        with:
          repository: FuguBSD/Tooling
          path: tooling

      # The synced copies under scripts/, t/ci/ and the lint
      # configurations must match FuguBSD/Tooling exactly.
      - name: Check tooling drift
        run: ./tooling/scripts/sync --check

  spec:
    name: Spec
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate the specification
        run: make spec-check

      - name: Check the prose
        run: make ste-lint

      - name: Drift gate
        if: github.event_name == 'pull_request'
        run: scripts/spec-check --drift "origin/${{ github.base_ref }}"
