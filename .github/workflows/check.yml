name: Check

# The gitleaks job reads every path, so no paths filter applies:
# every push must run the secrets scan.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Perl
        uses: FuguBSD/Tooling/perl/actions/setup-perl@main
        with:
          dependencies: test

      # The format gate runs prettier through bunx.
      - name: Setup bun
        uses: FuguBSD/Tooling/actions/setup-bun@main

      - name: Check formatting
        run: make format

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Perl
        uses: FuguBSD/Tooling/perl/actions/setup-perl@main
        with:
          dependencies: test

      - name: Check lint
        run: make lint

      # find -exec ... \; does not propagate the exit status, so a
      # module that fails to compile prints an error and the step
      # passes. xargs does propagate it.
      - name: Check Perl syntax
        run: |
          find lib -name "*.pm" -print0 | xargs -0 -n1 perl -I lib -cw

  drift:
    name: Drift
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Checkout the shared tooling
        uses: actions/checkout@v4
        with:
          repository: FuguBSD/Tooling
          path: tooling

      # The synced copies under scripts/, t/ci/ and the lint
      # configurations must match FuguBSD/Tooling exactly.
      - name: Check tooling drift
        run: ./tooling/scripts/sync --check

  spec:
    name: Spec
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate the specification
        run: make spec-check

      - name: Check the prose
        run: make ste-lint

      - name: Drift gate
        if: github.event_name == 'pull_request'
        run: scripts/spec-check --drift "origin/${{ github.base_ref }}"

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest

    steps:
      # The gate scans the git history, so the checkout is full
      # (WFL-GITLEAKS-2). A shallow checkout hides old commits.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup gitleaks
        uses: FuguBSD/Tooling/actions/setup-gitleaks@main

      - name: Scan for secrets
        run: make gitleaks
