name: Tag

# Cut a release from an environment that cannot push a tag. A
# maintainer with a shell runs `git tag v0.3.0 && git push origin
# v0.3.0`, and Release answers the push. An agent environment gets
# HTTP 403 on that push, so it dispatches this workflow instead.
#
# The release job here is not a duplicate of release.yml. GitHub
# raises no push event for a tag that GITHUB_TOKEN pushes, to stop a
# workflow from starting itself, so the tag below starts no Release
# run. This workflow therefore calls the shared release workflow, and
# names the tag that the first job made.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "The semantic version tag, for example v0.3.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  tag:
    name: Tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The tag needs the history, because the shape check reads
          # the tags that the repository already holds.
          fetch-depth: 0

      # A version of the wrong shape would name a tag that the release
      # rejects, after the tag reached the remote. Both checks
      # therefore run before the push.
      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "tag: '$VERSION' is not v<MAJOR>.<MINOR>.<PATCH>" >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "tag: $VERSION exists already" >&2
            exit 1
          fi

      - name: Create and push the tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Fugu $VERSION"
          git push origin "$VERSION"

  release:
    name: Release
    needs: tag
    uses: FuguBSD/Tooling/.github/workflows/perl-release.yml@main
    with:
      dist: Fugu
      name: Fugu
      pause: true
      tag: ${{ inputs.version }}
    secrets: inherit
